<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nelv</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="lib/styles.css" rel="stylesheet">
</head>
<body>
    <div class="noise"></div>
    <div class="vignette"></div>
    <div class="grid-bg"></div>
    <div class="grid-ol">
        <div class="gl-horizontal"></div>
        <div class="gl-vertical"></div>
    </div>

    
    <div class="cursor"></div>
    
    <section id="home" class="section">
        <div class="container">
            <div class="title" id="titleText">nelv</div>
            <a href="https://github.com/nelvismyname" target="_blank" class="github-btn">
                <img src="lib/icons/github.svg" alt="github" style="width: 24px; height: 24px; user-select: none; pointer-events: none;"  draggable="false">
                <span>GitHub</span>
            </a>
        </div>
    </section>

    <section id="tech" class="section">
        <div class="container">
            <h2 class="section-title">Technologies</h2>
            <div class="tech-grid">
                <div class="tech-card">
                    <object type="image/svg+xml" data="lib/icons/python.svg" class="tech-icon" style="user-select: none; pointer-events: none;" draggable="false"></object>
                    <div class="tech-name">Python</div>
                </div>
                <div class="tech-card">
                    <object type="image/svg+xml" data="lib/icons/html.svg" class="tech-icon" style="user-select: none; pointer-events: none;" draggable="false"></object>
                    <div class="tech-name">HTML</div>
                </div>
                <div class="tech-card">
                    <object type="image/svg+xml" data="lib/icons/css.svg" class="tech-icon" style="user-select: none; pointer-events: none;" draggable="false"></object>
                    <div class="tech-name">CSS</div>
                </div>
                <div class="tech-card">
                    <object type="image/svg+xml" data="lib/icons/javascript.svg" class="tech-icon" style="user-select: none; pointer-events: none;" draggable="false"></object>
                    <div class="tech-name">JavaScript</div>
                </div>
                <div class="tech-card">
                    <object type="image/svg+xml" data="lib/icons/lua.svg" class="tech-icon" style="user-select: none; pointer-events: none;" draggable="false"></object>
                    <div class="tech-name">Lua</div>
                </div>
            </div>
        </div>
    </section>

    <section id="contact" class="section">
        <div class="container">
            <h2 class="section-title">Contact</h2>
            
            <div class="discord-tag">
                <img src="lib/icons/discord.svg"  alt="Lua"  style="width: 24px; height: 24px; user-select: none; pointer-events: none;"  draggable="false">
                <span>_nelv</span>
            </div>
        </div>
    </section>

    <script src="lib/script.js"></script>
</body>
</html>
